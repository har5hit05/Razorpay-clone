DB_USER: postgres
DB_PASS: admin
spring:
  application:
    name: razorpay
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/razorpayDB}
    username: ${DB_USER:}
    password: ${DB_PASS:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

vault:
  master-key: JMHDBAlQNWFtDn3/bEGfi4ptlJhtHyhj6+EQQS36WQs=

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80
jwt:
  secret-key: dont-use-in-prod-asjdh9o82yekjhdds8fyq3rihsdfkjhaskfsadlkfj

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2